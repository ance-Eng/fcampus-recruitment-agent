# 校园招聘智能筛选 - Docker Compose 一键部署
# 使用方法：
#   1. 安装 Docker 和 Docker Compose
#   2. 修改 .env 中的 API_KEY 等配置
#   3. docker-compose up -d
#   4. 访问 http://localhost （Nginx 反向代理）

version: "3.8"

services:
  # ========== FastAPI 后端 ==========
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: campus-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - API_KEY=${API_KEY:-}
      - BASE_URL=${BASE_URL:-https://api.deepseek.com/v1}
      - MODEL=${MODEL:-deepseek-chat}
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - REDIS_URL=${REDIS_URL:-}
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========== Streamlit 前端 ==========
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: campus-frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
      - API_KEY=${API_KEY:-}
      - BASE_URL=${BASE_URL:-https://api.deepseek.com/v1}
      - MODEL=${MODEL:-deepseek-chat}
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./.streamlit:/app/.streamlit
    depends_on:
      backend:
        condition: service_healthy

  # ========== Nginx 反向代理 ==========
  nginx:
    image: nginx:alpine
    container_name: campus-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"  # HTTPS 时启用
    volumes:
      - ./nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./ssl:/etc/nginx/ssl:ro  # SSL 证书目录
    depends_on:
      - backend
      - frontend

  # ========== Redis 缓存（可选）==========
  redis:
    image: redis:7-alpine
    container_name: campus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data

volumes:
  redis_data:
