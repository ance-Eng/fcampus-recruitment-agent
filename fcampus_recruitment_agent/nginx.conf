# 校园招聘智能筛选 - Nginx 反向代理配置
# 使用方法：
#   1. 将此文件复制到 /etc/nginx/conf.d/campus_recruitment.conf
#   2. 修改 server_name 为你的域名或服务器IP
#   3. sudo nginx -t 测试配置
#   4. sudo systemctl reload nginx 重载
#
# 前提：FastAPI 运行在 8000 端口，Streamlit 运行在 8501 端口

upstream fastapi_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream streamlit_frontend {
    server 127.0.0.1:8501;
}

server {
    listen 80;
    server_name your-domain.com;  # 改成你的域名或服务器IP

    # 客户端上传大小限制（简历文件）
    client_max_body_size 20m;

    # 日志
    access_log /var/log/nginx/campus_recruitment_access.log;
    error_log /var/log/nginx/campus_recruitment_error.log;

    # ========== FastAPI 后端 ==========
    location /api/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大模型调用可能较慢，延长超时
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # FastAPI 文档
    location /docs {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /openapi.json {
        proxy_pass http://fastapi_backend;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://fastapi_backend;
        proxy_set_header Host $host;
    }

    # ========== Streamlit 前端 ==========
    location / {
        proxy_pass http://streamlit_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamlit 需要 WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 关闭缓冲，保证 Streamlit 实时更新
        proxy_buffering off;
        proxy_cache off;
    }

    # Streamlit 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://streamlit_frontend;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 健康检查端点
    location = /health {
        proxy_pass http://fastapi_backend/api/health;
        proxy_set_header Host $host;
    }
}

